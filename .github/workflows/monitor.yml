name: Blossom site monitor

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 7:17 AM Central
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python monitor.py --json results.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.json
